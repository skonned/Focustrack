<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Focustrack{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='static.css') }}">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
</head>
<body>
    <header class="site-header">
        <div class="w3-container w3-margin-bottom">
            <a href="/" class="header-logo">Home</a>
            <form id="auth-form" method="post">
                <input
                    type="text" 
                    name="username" 
                    placeholder="Username"
                >
                <input 
                    type="text" 
                    name="password" 
                    placeholder="Password"
                >
                <input type="submit" value="Login" formaction="/login"> <!-- If user clicks login, use the login route -->
                <input type="submit" value="Signup" formaction="/signup"> <!-- If user clicks signup, use the signup route -->
            </form>
        </div>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
